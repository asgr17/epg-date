name: Combined Test translate

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  grab-combined-epg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Grab Combined EPG
        run: |
          npm run grab -- \
            --channels=sites/_combined_test/combined_test.channels.xml \
            --output=guidetest-en.xml \
            --days=3
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # =========================
      # Translate Hebrew → English
      # =========================
      - name: Translate Hebrew EPG
        run: |
          pip install deep-translator lxml

          python3 <<'PY'
          from lxml import etree
          from deep_translator import GoogleTranslator
          import time

          FILE = "guidetest-en.xml"

          parser = etree.XMLParser(
              remove_blank_text=False,
              recover=True
          )

          tree = etree.parse(FILE, parser)
          root = tree.getroot()

          # deep-translator menggunakan "iw" untuk Hebrew
          translator = GoogleTranslator(
              source="iw",
              target="en"
          )

          translated = 0
          failed = 0

          # HANYA proses title/desc yang masih lang="he"
          elements = root.xpath(
              '//title[@lang="he"] | //desc[@lang="he"]'
          )

          print(f"Found {len(elements)} Hebrew elements")

          for element in elements:
              text = element.text

              if not text or not text.strip():
                  continue

              # Pastikan memang mengandung karakter Hebrew
              if not any('\u0590' <= c <= '\u05FF' for c in text):
                  continue

              try:
                  print(f"Translating: {text[:100]}")

                  result = translator.translate(text)

                  if result and result.strip():
                      element.text = result
                      element.set("lang", "en")

                      translated += 1

                      print(f"→ {result[:100]}")

                  # Beri jeda kecil agar tidak terlalu cepat request
                  time.sleep(0.2)

              except Exception as e:
                  failed += 1
                  print(f"Translation failed: {e}")
                  continue

          tree.write(
              FILE,
              encoding="UTF-8",
              xml_declaration=True,
              pretty_print=False
          )

          print("")
          print("================================")
          print(f"Total Hebrew elements : {len(elements)}")
          print(f"Translated            : {translated}")
          print(f"Failed                : {failed}")
          print("================================")
          PY

      # =========================
      # Commit hasil EPG
      # =========================
      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

          git add guidetest-en.xml

          git diff --cached --quiet || \
            git commit -m "🔄 Auto Update Combined EPG: $(date '+%Y-%m-%d %H:%M UTC')"

          git pull --rebase origin master
          git push
