name: Combined Test translate

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  grab-combined-epg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # Setup Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # =========================
      # Install dependencies
      # =========================
      - name: Install Dependencies
        run: npm ci

      # =========================
      # Grab EPG
      # =========================
      - name: Grab Combined EPG
        run: |
          npm run grab -- \
            --channels=sites/_combined_test/combined_test.channels.xml \
            --output=guidetest-en.xml \
            --days=3
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # =========================
      # Translate Hebrew → English
      # =========================
      - name: Translate Hebrew EPG
        run: |
          pip install -q argostranslate lxml

          python3 <<'PY'
          from lxml import etree
          import argostranslate.package
          import argostranslate.translate
          import re

          FILE = "guidetest-en.xml"

          # =====================================================
          # Install Hebrew → English Argos model
          # =====================================================

          print("Updating Argos package index...")

          argostranslate.package.update_package_index()

          packages = argostranslate.package.get_available_packages()

          package = next(
              (
                  p for p in packages
                  if p.from_code == "he"
                  and p.to_code == "en"
              ),
              None
          )

          if package is None:
              raise RuntimeError(
                  "Hebrew → English Argos model tidak ditemukan."
              )

          print(
              f"Installing model: "
              f"{package.from_code} → {package.to_code}"
          )

          argostranslate.package.install_from_path(
              package.download()
          )

          print("Argos Hebrew → English ready.")

          # =====================================================
          # Load XML
          # =====================================================

          parser = etree.XMLParser(
              remove_blank_text=False,
              recover=True
          )

          tree = etree.parse(FILE, parser)
          root = tree.getroot()

          # =====================================================
          # Detect Hebrew
          # =====================================================

          def contains_hebrew(text):
              if not text:
                  return False

              return bool(
                  re.search(r'[\u0590-\u05FF]', text)
              )

          # =====================================================
          # Translation cache
          #
          # Teks yang sama hanya diterjemahkan sekali.
          # =====================================================

          cache = {}

          translated = 0
          cached = 0
          skipped = 0
          failed = 0

          # =====================================================
          # Find ALL title + desc
          # =====================================================

          elements = root.xpath(
              '//title | //desc'
          )

          print("")
          print(
              f"Found {len(elements)} title/desc elements."
          )
          print("")

          # =====================================================
          # Process elements
          # =====================================================

          for index, element in enumerate(elements, 1):

              text = element.text

              # Tidak ada teks
              if not text or not text.strip():
                  skipped += 1
                  continue

              text = text.strip()

              # Hanya proses teks yang mengandung Hebrew
              if not contains_hebrew(text):
                  skipped += 1
                  continue

              print(
                  f"[{index}/{len(elements)}] "
                  f"Hebrew detected:"
              )

              print(
                  f"  {text[:300]}"
              )

              # =================================================
              # CACHE
              # =================================================

              if text in cache:

                  result = cache[text]

                  if result:
                      element.text = result
                      element.set("lang", "en")

                      translated += 1
                      cached += 1

                      print("  → CACHE:")
                      print(
                          f"  {result[:300]}"
                      )

                  else:
                      failed += 1

                  print("")
                  continue

              # =================================================
              # TRANSLATE
              # =================================================

              try:

                  result = argostranslate.translate.translate(
                      text,
                      "he",
                      "en"
                  )

                  if (
                      result
                      and result.strip()
                      and result.strip() != text
                  ):

                      result = result.strip()

                      # Simpan ke cache
                      cache[text] = result

                      # Simpan hasil ke XML
                      element.text = result
                      element.set("lang", "en")

                      translated += 1

                      print("  → SUCCESS:")
                      print(
                          f"  {result[:300]}"
                      )

                  else:

                      cache[text] = None

                      failed += 1

                      print(
                          "  → FAILED: empty or unchanged result"
                      )

              except Exception as e:

                  cache[text] = None

                  failed += 1

                  print(
                      f"  → FAILED: {str(e)[:300]}"
                  )

              print("")

          # =====================================================
          # Save XML
          # =====================================================

          tree.write(
              FILE,
              encoding="UTF-8",
              xml_declaration=True,
              pretty_print=False
          )

          # =====================================================
          # Summary
          # =====================================================

          print("")
          print("========================================")
          print("       ARGOS TRANSLATION SUMMARY")
          print("========================================")
          print(
              f"Elements checked : {len(elements)}"
          )
          print(
              f"Translated       : {translated}"
          )
          print(
              f"From cache       : {cached}"
          )
          print(
              f"Skipped          : {skipped}"
          )
          print(
              f"Failed           : {failed}"
          )
          print(
              f"Unique Hebrew    : {len(cache)}"
          )
          print("========================================")

          PY

      # =========================
      # Commit hasil EPG
      # =========================
      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

          git add guidetest-en.xml

          git diff --cached --quiet || \
            git commit \
              -m "🔄 Auto Update Combined EPG: $(date '+%Y-%m-%d %H:%M UTC')"

          git pull --rebase origin master
          git push
