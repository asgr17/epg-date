name: Combined Test translate

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  grab-combined-epg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # Setup Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # =========================
      # Install dependencies
      # =========================
      - name: Install Dependencies
        run: npm ci

      # =========================
      # Grab EPG
      # =========================
      - name: Grab Combined EPG
        run: |
          npm run grab -- \
            --channels=sites/_combined_test/combined_test.channels.xml \
            --output=guidetest-en.xml \
            --days=3
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # =========================
      # Translate Hebrew → English
      # =========================
      - name: Translate Hebrew EPG
        run: |
          pip install -q deep-translator lxml

          python3 <<'PY'
          from lxml import etree
          from deep_translator import GoogleTranslator
          import time
          import re

          FILE = "guidetest-en.xml"

          # =========================
          # XML parser
          # =========================
          parser = etree.XMLParser(
              remove_blank_text=False,
              recover=True
          )

          tree = etree.parse(FILE, parser)
          root = tree.getroot()

          # =========================
          # Translator
          # =========================
          translator = GoogleTranslator(
              source="iw",
              target="en"
          )

          # =========================
          # Detect Hebrew
          # =========================
          def contains_hebrew(text):
              if not text:
                  return False

              return bool(
                  re.search(r'[\u0590-\u05FF]', text)
              )

          # =========================
          # Translate with retry
          # =========================
          def translate_with_retry(text, retries=5):

              for attempt in range(1, retries + 1):

                  try:
                      result = translator.translate(text)

                      if (
                          result
                          and result.strip()
                          and result.strip() != text.strip()
                      ):
                          return result.strip()

                      print(
                          f"  Attempt {attempt}: "
                          "empty/unchanged result"
                      )

                  except Exception as e:

                      print(
                          f"  Attempt {attempt}/{retries} failed: "
                          f"{str(e)[:200]}"
                      )

                  # Increasing delay
                  delay = min(attempt * 3, 15)

                  print(
                      f"  Waiting {delay}s before retry..."
                  )

                  time.sleep(delay)

              return None

          # =========================
          # Find ALL title + desc
          # =========================
          elements = root.xpath(
              '//title | //desc'
          )

          print(
              f"Checking {len(elements)} title/desc elements..."
          )

          translated = 0
          skipped = 0
          failed = 0

          # =========================
          # Process
          # =========================
          for index, element in enumerate(elements, 1):

              text = element.text

              # Empty
              if not text or not text.strip():
                  skipped += 1
                  continue

              # Only Hebrew
              if not contains_hebrew(text):
                  skipped += 1
                  continue

              print("")
              print(
                  f"[{index}/{len(elements)}] Translating:"
              )
              print(
                  f"  {text[:250]}"
              )

              result = translate_with_retry(text)

              if result:

                  # Save translation
                  element.text = result

                  # Only NOW change language
                  element.set("lang", "en")

                  translated += 1

                  print("  → SUCCESS:")
                  print(
                      f"  {result[:250]}"
                  )

              else:

                  # IMPORTANT:
                  # Do NOT modify original text
                  # and do NOT change lang
                  failed += 1

                  print(
                      "  → FAILED: keeping original text"
                  )

              # Small delay between successful requests
              time.sleep(0.5)

          # =========================
          # Save XML
          # =========================
          tree.write(
              FILE,
              encoding="UTF-8",
              xml_declaration=True,
              pretty_print=False
          )

          # =========================
          # Summary
          # =========================
          print("")
          print("========================================")
          print("         TRANSLATION SUMMARY")
          print("========================================")
          print(
              f"Total elements checked : {len(elements)}"
          )
          print(
              f"Translated             : {translated}"
          )
          print(
              f"Skipped                : {skipped}"
          )
          print(
              f"Failed                 : {failed}"
          )
          print("========================================")

          if failed > 0:
              print("")
              print(
                  "WARNING: Some Hebrew texts could not "
                  "be translated."
              )
              print(
                  "They were intentionally left unchanged."
              )

          PY

      # =========================
      # Commit hasil EPG
      # =========================
      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

          git add guidetest-en.xml

          git diff --cached --quiet || \
            git commit \
              -m "🔄 Auto Update Combined EPG: $(date '+%Y-%m-%d %H:%M UTC')"

          git pull --rebase origin master
          git push
